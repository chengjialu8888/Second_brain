<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Second Brain user journey</title>
  <desc id="desc">A five step loop from captured sources to preserved evidence, structured memory, cited thinking, and continuous improvement.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth" viewBox="0 0 10 8">
      <path d="M0 0 L10 4 L0 8 z" fill="#0A0A0A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/>
  <line x1="70" y1="126" x2="1548" y2="126" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="70" y1="752" x2="1548" y2="752" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="70" y1="126" x2="70" y2="752" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="1548" y1="126" x2="1548" y2="752" stroke="#0A0A0A" stroke-width="3"/>

  <text x="70" y="78" fill="#0A0A0A" font-size="50" font-weight="800">Second Brain User Journey</text>
  <text x="72" y="108" fill="#333333" font-size="22" font-weight="600">From scattered context to maintained, callable memory</text>

  <g transform="translate(85 184)">
    <rect x="6" y="6" width="250" height="404" fill="#0A0A0A"/>
    <rect x="0" y="0" width="250" height="404" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <text x="24" y="102" fill="#0A0A0A" font-size="102" font-weight="900">01</text>
    <text x="28" y="152" fill="#0A0A0A" font-size="34" font-weight="800">Capture</text>
    <rect x="30" y="174" width="106" height="36" fill="#0A0A0A"/>
    <text x="52" y="199" fill="#FFFFFF" font-size="18" font-weight="700">Human</text>
    <text x="28" y="254" fill="#0A0A0A" font-size="22" font-weight="800">Drop in sources</text>
    <text x="28" y="292" fill="#333333" font-size="20">Feishu calendar</text>
    <text x="28" y="328" fill="#333333" font-size="20">Chat exports</text>
    <text x="28" y="364" fill="#333333" font-size="20">Docs, links, notes</text>
  </g>

  <line x1="345" y1="386" x2="375" y2="386" stroke="#0A0A0A" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(385 184)">
    <rect x="6" y="6" width="250" height="404" fill="#0A0A0A"/>
    <rect x="0" y="0" width="250" height="404" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="3"/>
    <text x="24" y="102" fill="#0A0A0A" font-size="102" font-weight="900">02</text>
    <text x="28" y="152" fill="#0A0A0A" font-size="34" font-weight="800">Preserve</text>
    <rect x="30" y="174" width="98" height="36" fill="#0A0A0A"/>
    <text x="50" y="199" fill="#FFFFFF" font-size="18" font-weight="700">Agent</text>
    <text x="28" y="254" fill="#0A0A0A" font-size="22" font-weight="800">Keep evidence raw</text>
    <text x="28" y="292" fill="#333333" font-size="20">Source snapshot</text>
    <text x="28" y="328" fill="#333333" font-size="20">Stable references</text>
    <text x="28" y="364" fill="#333333" font-size="20">No silent overwrite</text>
  </g>

  <line x1="645" y1="386" x2="675" y2="386" stroke="#0A0A0A" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(685 184)">
    <rect x="6" y="6" width="250" height="404" fill="#0A0A0A"/>
    <rect x="0" y="0" width="250" height="404" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="3"/>
    <text x="24" y="102" fill="#0A0A0A" font-size="102" font-weight="900">03</text>
    <text x="28" y="152" fill="#0A0A0A" font-size="34" font-weight="800">Structure</text>
    <rect x="30" y="174" width="98" height="36" fill="#0A0A0A"/>
    <text x="50" y="199" fill="#FFFFFF" font-size="18" font-weight="700">Agent</text>
    <text x="28" y="254" fill="#0A0A0A" font-size="22" font-weight="800">Resolve into pages</text>
    <text x="28" y="292" fill="#333333" font-size="20">Resolver routes</text>
    <text x="28" y="328" fill="#333333" font-size="20">Schema writes</text>
    <text x="28" y="364" fill="#333333" font-size="20">Entities and diary</text>
  </g>

  <line x1="945" y1="386" x2="975" y2="386" stroke="#0A0A0A" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(985 184)">
    <rect x="6" y="6" width="250" height="404" fill="#0A0A0A"/>
    <rect x="0" y="0" width="250" height="404" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <text x="24" y="102" fill="#0A0A0A" font-size="102" font-weight="900">04</text>
    <text x="28" y="152" fill="#0A0A0A" font-size="34" font-weight="800">Think</text>
    <rect x="30" y="174" width="122" height="36" fill="#0A0A0A"/>
    <text x="50" y="199" fill="#FFFFFF" font-size="18" font-weight="700">Human + AI</text>
    <text x="28" y="254" fill="#0A0A0A" font-size="22" font-weight="800">Use with sources</text>
    <text x="28" y="292" fill="#333333" font-size="20">Search evidence</text>
    <text x="28" y="328" fill="#333333" font-size="20">Synthesize answer</text>
    <text x="28" y="364" fill="#333333" font-size="20">Show missing gaps</text>
  </g>

  <line x1="1245" y1="386" x2="1275" y2="386" stroke="#0A0A0A" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1285 184)">
    <rect x="6" y="6" width="250" height="404" fill="#0A0A0A"/>
    <rect x="0" y="0" width="250" height="404" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="3"/>
    <text x="24" y="102" fill="#0A0A0A" font-size="102" font-weight="900">05</text>
    <text x="28" y="152" fill="#0A0A0A" font-size="34" font-weight="800">Improve</text>
    <rect x="30" y="174" width="98" height="36" fill="#0A0A0A"/>
    <text x="50" y="199" fill="#FFFFFF" font-size="18" font-weight="700">Agent</text>
    <text x="28" y="254" fill="#0A0A0A" font-size="22" font-weight="800">Turn gaps into fuel</text>
    <text x="28" y="292" fill="#333333" font-size="20">Lint stale claims</text>
    <text x="28" y="328" fill="#333333" font-size="20">Ask follow-ups</text>
    <text x="28" y="364" fill="#333333" font-size="20">Enrich memory</text>
  </g>

  <polyline points="1410,588 1410,696 210,696 210,610" fill="none" stroke="#0A0A0A" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="455" y="658" width="690" height="76" fill="#0A0A0A"/>
  <text x="492" y="690" fill="#FFFFFF" font-size="24" font-weight="800">The loop is the product</text>
  <text x="492" y="720" fill="#FFFFFF" font-size="20">Calendar knows what happened. You add what it meant.</text>

  <rect x="70" y="752" width="490" height="66" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="96" y="793" fill="#0A0A0A" font-size="24" font-weight="800">Evidence first</text>
  <rect x="560" y="752" width="490" height="66" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="3"/>
  <text x="586" y="793" fill="#0A0A0A" font-size="24" font-weight="800">Search before synthesis</text>
  <rect x="1050" y="752" width="498" height="66" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="3"/>
  <text x="1076" y="793" fill="#0A0A0A" font-size="24" font-weight="800">Gaps become prompts</text>
</svg>
