<svg width="1680" height="1040" viewBox="0 0 1680 1040" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Second Brain user journey / 用户旅程</title>
  <desc id="desc">A bilingual six-step journey from capture to retain, recall planning, evidence ledger, active workspace, and role-shaped output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth" viewBox="0 0 10 8">
      <path d="M0 0 L10 4 L0 8 z" fill="#0F0F0F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1040" fill="#EFE9D9"/>
  <line x1="64" y1="138" x2="1616" y2="138" stroke="#0F0F0F" stroke-width="4"/>
  <line x1="64" y1="930" x2="1616" y2="930" stroke="#0F0F0F" stroke-width="4"/>
  <line x1="64" y1="138" x2="64" y2="930" stroke="#0F0F0F" stroke-width="4"/>
  <line x1="1616" y1="138" x2="1616" y2="930" stroke="#0F0F0F" stroke-width="4"/>

  <rect x="74" y="54" width="154" height="46" fill="#F5C518" stroke="#0F0F0F" stroke-width="4"/>
  <text x="92" y="84" fill="#0F0F0F" font-size="22" font-weight="800">JOURNEY</text>
  <text x="252" y="82" fill="#0F0F0F" font-size="52" font-weight="900">Second Brain User Journey / 用户旅程</text>
  <text x="254" y="118" fill="#2A2A2A" font-size="22" font-weight="700">Less context, better recall / 少塞上下文，多做主动回忆</text>

  <g transform="translate(98 188)">
    <rect x="10" y="10" width="438" height="226" fill="#0F0F0F"/>
    <rect x="0" y="0" width="438" height="226" fill="#E4DCC4" stroke="#0F0F0F" stroke-width="4"/>
    <text x="24" y="52" fill="#0F0F0F" font-size="44" font-weight="900">01</text>
    <text x="92" y="48" fill="#0F0F0F" font-size="30" font-weight="900">Capture / 采集</text>
    <text x="92" y="82" fill="#2A2A2A" font-size="19" font-weight="700">Collect traces / 汇集碎片</text>
    <line x1="24" y1="104" x2="414" y2="104" stroke="#0F0F0F" stroke-width="3"/>
    <text x="28" y="140" fill="#0F0F0F" font-size="21" font-weight="800">Feishu calendar / 飞书日历</text>
    <text x="28" y="172" fill="#0F0F0F" font-size="21" font-weight="800">Chats, docs, links / 群聊、文档、链接</text>
    <text x="28" y="204" fill="#0F0F0F" font-size="21" font-weight="800">Notes and ideas / 笔记和想法</text>
  </g>

  <line x1="552" y1="301" x2="622" y2="301" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(636 188)">
    <rect x="10" y="10" width="438" height="226" fill="#0F0F0F"/>
    <rect x="0" y="0" width="438" height="226" fill="#1F8A4C" stroke="#0F0F0F" stroke-width="4"/>
    <text x="24" y="52" fill="#EFE9D9" font-size="44" font-weight="900">02</text>
    <text x="92" y="48" fill="#EFE9D9" font-size="30" font-weight="900">Retain / 留存编译</text>
    <text x="92" y="82" fill="#EFE9D9" font-size="19" font-weight="700">Preserve then compile / 留存后编译</text>
    <line x1="24" y1="104" x2="414" y2="104" stroke="#EFE9D9" stroke-width="3"/>
    <text x="28" y="140" fill="#EFE9D9" font-size="21" font-weight="800">Snapshots / 原始快照</text>
    <text x="28" y="172" fill="#EFE9D9" font-size="21" font-weight="800">Pages / 实体页</text>
    <text x="28" y="204" fill="#EFE9D9" font-size="21" font-weight="800">Truth + Timeline / 认知 + 时间线</text>
  </g>

  <line x1="1090" y1="301" x2="1160" y2="301" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1174 188)">
    <rect x="10" y="10" width="408" height="226" fill="#0F0F0F"/>
    <rect x="0" y="0" width="408" height="226" fill="#F5C518" stroke="#0F0F0F" stroke-width="4"/>
    <text x="24" y="52" fill="#0F0F0F" font-size="44" font-weight="900">03</text>
    <text x="92" y="48" fill="#0F0F0F" font-size="30" font-weight="900">Recall Plan / 回忆计划</text>
    <text x="92" y="82" fill="#2A2A2A" font-size="19" font-weight="700">Choose recall route / 选择路线</text>
    <line x1="24" y1="104" x2="384" y2="104" stroke="#0F0F0F" stroke-width="3"/>
    <text x="28" y="140" fill="#0F0F0F" font-size="21" font-weight="800">Time, entity, state / 时间、实体、状态</text>
    <text x="28" y="172" fill="#0F0F0F" font-size="21" font-weight="800">Number, conflict / 数值、冲突点</text>
    <text x="28" y="204" fill="#0F0F0F" font-size="21" font-weight="800">Relations / 关系链路</text>
  </g>

  <polyline points="1378,426 1378,478 302,478 302,526" fill="none" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(98 540)">
    <rect x="10" y="10" width="438" height="246" fill="#0F0F0F"/>
    <rect x="0" y="0" width="438" height="246" fill="#F06CA8" stroke="#0F0F0F" stroke-width="4"/>
    <text x="24" y="52" fill="#0F0F0F" font-size="44" font-weight="900">04</text>
    <text x="92" y="48" fill="#0F0F0F" font-size="30" font-weight="900">Ledger / 证据账本</text>
    <text x="92" y="82" fill="#0F0F0F" font-size="19" font-weight="800">Organize facts first / 先整理证据</text>
    <line x1="24" y1="104" x2="414" y2="104" stroke="#0F0F0F" stroke-width="3"/>
    <text x="28" y="140" fill="#0F0F0F" font-size="21" font-weight="800">Dedupe + dates / 去重 + 日期</text>
    <text x="28" y="172" fill="#0F0F0F" font-size="21" font-weight="800">Source + status / 来源 + 状态</text>
    <text x="28" y="204" fill="#0F0F0F" font-size="21" font-weight="800">Current vs historical / 当前 vs 历史</text>
    <text x="28" y="232" fill="#0F0F0F" font-size="19" font-weight="700">No raw prompt / 原始资料不进上下文</text>
  </g>

  <line x1="552" y1="663" x2="622" y2="663" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(636 540)">
    <rect x="10" y="10" width="438" height="246" fill="#0F0F0F"/>
    <rect x="0" y="0" width="438" height="246" fill="#E4DCC4" stroke="#0F0F0F" stroke-width="4"/>
    <text x="24" y="52" fill="#0F0F0F" font-size="44" font-weight="900">05</text>
    <text x="92" y="48" fill="#0F0F0F" font-size="30" font-weight="900">Workspace / 当前白板</text>
    <text x="92" y="82" fill="#2A2A2A" font-size="19" font-weight="700">Small task context / 小型任务上下文</text>
    <line x1="24" y1="104" x2="414" y2="104" stroke="#0F0F0F" stroke-width="3"/>
    <text x="28" y="140" fill="#0F0F0F" font-size="21" font-weight="800">5-12 active claims / 5-12 条关键判断</text>
    <text x="28" y="172" fill="#0F0F0F" font-size="21" font-weight="800">Coverage matrix / 覆盖矩阵</text>
    <text x="28" y="204" fill="#0F0F0F" font-size="21" font-weight="800">Claim audit + gaps / 判断审计 + 缺口</text>
    <text x="28" y="232" fill="#0F0F0F" font-size="19" font-weight="700">Compact prompt packet / 压缩上下文包</text>
  </g>

  <line x1="1090" y1="663" x2="1160" y2="663" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1174 540)">
    <rect x="10" y="10" width="408" height="246" fill="#0F0F0F"/>
    <rect x="0" y="0" width="408" height="246" fill="#EFE9D9" stroke="#0F0F0F" stroke-width="4"/>
    <text x="24" y="52" fill="#0F0F0F" font-size="44" font-weight="900">06</text>
    <text x="92" y="48" fill="#0F0F0F" font-size="30" font-weight="900">Output / 输出回写</text>
    <text x="92" y="82" fill="#2A2A2A" font-size="19" font-weight="700">Use + verify / 使用和校验</text>
    <line x1="24" y1="104" x2="384" y2="104" stroke="#0F0F0F" stroke-width="3"/>
    <text x="28" y="140" fill="#0F0F0F" font-size="21" font-weight="800">Strategy report / 战略报告</text>
    <text x="28" y="172" fill="#0F0F0F" font-size="21" font-weight="800">Specialist lens / 岗位专家视角</text>
    <text x="28" y="204" fill="#0F0F0F" font-size="21" font-weight="800">Verify + handoff / 校验 + 交接</text>
    <text x="28" y="232" fill="#0F0F0F" font-size="19" font-weight="700">Facts back to pages / 事实回写页面</text>
  </g>

  <polyline points="1378,796 1378,872 316,872 316,802" fill="none" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="562" y="830" width="552" height="76" fill="#0F0F0F"/>
  <text x="596" y="862" fill="#EFE9D9" font-size="25" font-weight="900">Recall beats context stuffing</text>
  <text x="596" y="892" fill="#EFE9D9" font-size="21" font-weight="700">闭环不是塞满上下文，而是把回忆做完整</text>

  <rect x="98" y="950" width="460" height="54" fill="#1F8A4C" stroke="#0F0F0F" stroke-width="4"/>
  <text x="126" y="984" fill="#EFE9D9" font-size="23" font-weight="900">Evidence first / 证据优先</text>
  <rect x="610" y="950" width="460" height="54" fill="#F5C518" stroke="#0F0F0F" stroke-width="4"/>
  <text x="638" y="984" fill="#0F0F0F" font-size="23" font-weight="900">Recall first / 先回忆</text>
  <rect x="1122" y="950" width="460" height="54" fill="#F06CA8" stroke="#0F0F0F" stroke-width="4"/>
  <text x="1150" y="984" fill="#0F0F0F" font-size="23" font-weight="900">Gaps to prompts / 缺口变问题</text>
</svg>
