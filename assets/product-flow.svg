  <text x="1142" y="260" fill="#2A2A2A" font-size="17" font-weight="700">Plan routes before retrieval</text>

  <rect x="1142" y="278" width="204" height="64" fill="#EFE9D9" stroke="#0F0F0F" stroke-width="4"/>
  <text x="1166" y="316" fill="#0F0F0F" font-size="21" font-weight="900">time / 时间</text>
