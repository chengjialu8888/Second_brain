  <text x="88" y="938" fill="#0F0F0F" font-size="20" font-weight="800">event time, source, fact type</text>
  <text x="88" y="968" fill="#0F0F0F" font-size="20" font-weight="800">事件时间、提及时间、来源、事实类型</text>
  <text x="88" y="998" fill="#0F0F0F" font-size="20" font-weight="800">dedupe, normalize, mark status</text>

  <line x1="530" y1="934" x2="586" y2="934" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

