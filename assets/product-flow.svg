<svg width="1680" height="1080" viewBox="0 0 1680 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Second Brain core architecture / 核心架构</title>
  <desc id="desc">A bilingual architecture diagram showing sources, retain, canonical memory, recall controller, evidence ledger, active workspace, verify, and output.</desc>
  <defs>
