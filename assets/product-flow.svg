  <text x="614" y="904" fill="#0F0F0F" font-size="28" font-weight="900">Active Workspace</text>
  <text x="614" y="938" fill="#0F0F0F" font-size="20" font-weight="800">claims, coverage, audit</text>
  <text x="614" y="968" fill="#0F0F0F" font-size="20" font-weight="800">5-12 条判断、覆盖矩阵、判断审计</text>
  <text x="614" y="998" fill="#0F0F0F" font-size="20" font-weight="800">compact prompt packet / 压缩上下文包</text>

  <line x1="1056" y1="934" x2="1112" y2="934" stroke="#0F0F0F" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1124" y="870" width="494" height="152" fill="#0F0F0F"/>
  <rect x="1112" y="858" width="494" height="152" fill="#EFE9D9" stroke="#0F0F0F" stroke-width="4"/>
  <text x="1140" y="904" fill="#0F0F0F" font-size="28" font-weight="900">Verify + Output / 校验与输出</text>
  <text x="1140" y="938" fill="#0F0F0F" font-size="20" font-weight="800">strategy-report, lenses, citations</text>
  <text x="1140" y="968" fill="#0F0F0F" font-size="20" font-weight="800">战略报告、专家视角、有引用的回答</text>
  <text x="1140" y="998" fill="#0F0F0F" font-size="20" font-weight="800">handoff facts to memory / 事实回写记忆</text>

  <rect x="60" y="800" width="1558" height="38" fill="#0F0F0F"/>
  <text x="86" y="826" fill="#EFE9D9" font-size="20" font-weight="900">Prompt boundary / 上下文边界：raw sources stay in filesystem; ledger + workspace become the compact callable context.</text>
</svg>
