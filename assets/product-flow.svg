  <text x="92" y="79" fill="#0F0F0F" font-size="22" font-weight="900">ARCHITECTURE</text>
  <text x="316" y="80" fill="#0F0F0F" font-size="52" font-weight="900">Second Brain Core Architecture / 核心架构</text>
  <text x="318" y="118" fill="#2A2A2A" font-size="22" font-weight="700">Sources stay local. Recall creates a compact evidence packet. / 资料留在本地，回忆生成压缩证据包。</text>

