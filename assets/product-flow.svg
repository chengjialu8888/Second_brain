  <text x="1166" y="406" fill="#0F0F0F" font-size="21" font-weight="900">state / 状态</text>
  <rect x="1374" y="368" width="204" height="64" fill="#EFE9D9" stroke="#0F0F0F" stroke-width="4"/>
  <text x="1398" y="406" fill="#0F0F0F" font-size="21" font-weight="900">number / 数值</text>
  <rect x="1142" y="458" width="204" height="64" fill="#EFE9D9" stroke="#0F0F0F" stroke-width="4"/>
  <text x="1166" y="496" fill="#0F0F0F" font-size="21" font-weight="900">conflict / 冲突</text>
  <rect x="1374" y="458" width="204" height="64" fill="#EFE9D9" stroke="#0F0F0F" stroke-width="4"/>
  <text x="1398" y="496" fill="#0F0F0F" font-size="21" font-weight="900">relation / 关系</text>

