  <rect x="462" y="758" width="392" height="136" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="490" y="796" fill="#0A0A0A" font-size="25" font-weight="800">Search is retrieval</text>
